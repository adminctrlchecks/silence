packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  sweph: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@roxyapi/ui-react@0.27.5'
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - sweph
  - unrs-resolver
