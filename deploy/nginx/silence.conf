# Silence — Nginx vhost, isolated from CtrlChecks (its own server_name + file).
# Install:
#   sudo cp deploy/nginx/silence.conf /etc/nginx/sites-available/silence.conf
#   sudo ln -s /etc/nginx/sites-available/silence.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx      # reload, NOT restart
#
# Routing:
#   /api/v1/  -> API   (127.0.0.1:3010)  — direct backend + Swagger (mobile/tools)
#   /         -> web   (127.0.0.1:3011)  — pages AND the web's same-origin /api/* proxy routes
#
# TLS: obtain a cert after DNS resolves, e.g.
#   sudo certbot --nginx -d silence.ctrlchecks.ai
# certbot rewrites this file to add the :443 server block and HTTP->HTTPS redirect.

upstream silence_api {
    server 127.0.0.1:3010;
}
upstream silence_web {
    server 127.0.0.1:3011;
}

server {
    listen 80;
    listen [::]:80;
    server_name silence.ctrlchecks.ai;

    # Allow .xlsx uploads for the admin Excel import.
    client_max_body_size 15m;

    # Direct backend API (versioned prefix) + Swagger docs.
    location /api/v1/ {
        proxy_pass http://silence_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else -> Next.js web (includes its /api/auth, /api/admin, ... proxy routes).
    location / {
        proxy_pass http://silence_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
