name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: silence_user
          POSTGRES_PASSWORD: silence_pass
          POSTGRES_DB: silence_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silence_user -d silence_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @silence/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests with coverage
        run: pnpm --filter @silence/api test -- --coverage --runInBand
        env:
          TEST_DATABASE_URL: postgresql://silence_user:silence_pass@localhost:5432/silence_db?schema=silence_e2e
          DATABASE_URL: postgresql://silence_user:silence_pass@localhost:5432/silence_db?schema=public
          JWT_ADMIN_SECRET: ci-admin-secret
          JWT_USER_SECRET: ci-user-secret
          GEMINI_API_KEY: ''

      - name: Build
        run: pnpm build
